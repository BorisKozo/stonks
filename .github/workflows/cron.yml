name: cron
on:
  schedule:
    # GitHub cron is UTC-only: 11:00 UTC = 13:00 Israel time during IST (winter),
    # 14:00 during IDT (summer). Use '0 10 * * *' for 13:00 in summer.
    - cron: '0 11 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cron
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r ./requirements.txt

      - name: Run Sync
        run: |
          python3 main.py

      # Deploy whatever succeeded even if some symbols failed; keep_files leaves
      # the last good price of a failed symbol in place instead of deleting it.
      - name: Deploy
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          keep_files: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
